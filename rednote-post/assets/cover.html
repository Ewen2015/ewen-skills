  <!-- 眉标：左=作者·年份，右=栏目·主题 -->

    <div class="kicker">ANNE CARSON &middot; 2001</div>
    <div class="kicker">阅读笔记 &middot; 诗歌</div>
  </div>
  <div class="rule"></div>

  <!-- 一句话冲突。em 用来给关键字上强调色，不要整句都强调 -->
  <h1>婚姻是一支，<br>必须跳完的<em style="font-style:normal;color:var(--accent)">探戈</em></h1>
  <p class="hsub">29 首探戈写一段婚姻的来与去 &mdash; 也写给济慈说的「美即是真」。</p>
