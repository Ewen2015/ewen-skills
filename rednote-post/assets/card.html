<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 把 card.css 复制到同一目录 -->
<link rel="stylesheet" href="card.css">
<style>
  /* 只保留本张卡需要的区块样式；下面两块是备选，删掉用不到的那块 */
</style>
</head>
<body>
<div class="card">

  <div class="top">
    <div class="kicker">核心机制</div>
    <div class="kicker">01 / 03</div>
  </div>
  <div class="rule"></div>
  <p class="rlab">意会认知 &middot; TACIT KNOWING</p>
  <h1>你以为你在思考，<br>其实你在「内居」</h1>

  <!-- 区块 A：带编号的原理条目。每条 = 主张 + 例子 + 出处 -->
  <div class="rows">
    <div class="row">
      <div class="num">01</div>
      <div>
        <div class="rt">附带 &rarr; 焦点<span>subsidiary &rarr; focal</span></div>
        <div class="rd">用锤子时，手感在手上，注意力却钉在钉子上。细节必须退到背景，整体才会浮现。<em>p109&ndash;113</em></div>
      </div>
    </div>
    <div class="row">
      <div class="num">02</div>
      <div>
        <div class="rt">内居<span>indwelling</span></div>
        <div class="rd">把自己放进线索里，让它成为「我们自身的一部分」。</div>
      </div>
    </div>
  </div>

  <!-- 区块 B：N 条能带走的点。td 是观点，use 是「所以怎么用」 -->
  <!--
  <div class="list">
    <div class="item">
      <div class="k2">1</div>
      <div>
        <div class="tt">附带 &rarr; 焦点</div>
        <div class="td">手感在手上，注意力却在钉子上。细节退到背景，整体才会浮现。</div>
        <div class="use">&rarr; 别一边做一边解剖自己，先做进去。</div>
      </div>
    </div>
  </div>
  -->

  <div class="quote">
    <b>所知多于能言</b>
    <i>we can know more than we can tell.　p109</i>
  </div>

  <div class="foot">
    <span>认知与存在 &middot; 意会认知</span>
    <span>南京大学出版社 2017</span>
  </div>
</div>
</body>
</html>
